<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Flock</title>
  <link rel="icon" type="image/svg+xml" href="/flock.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sidebar.css">
  <link rel="stylesheet" href="/conversation.css">
  <link rel="stylesheet" href="/conversation-find.css">
  <link rel="stylesheet" href="/composer.css">
  <link rel="stylesheet" href="/dialog.css">
  <link rel="stylesheet" href="/bot-editor.css">
  <link rel="stylesheet" href="/board-inbox.css">
  <link rel="modulepreload" href="/board-inbox.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="workspace">
    <aside id="navigation" class="sidebar" aria-label="Bot navigation">
      <div class="sidebar-head">
        <h2 id="bots-heading" class="sidebar-title">Bots</h2>
        <button id="new-bot-button" class="icon-button new-bot-button" type="button" aria-label="New Bot" title="New Bot" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="close-navigation" class="icon-button narrow-only" type="button" aria-label="Close Bot list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </div>
      <div class="sidebar-scroll">
        <section class="nav-section bots" aria-labelledby="bots-heading">
          <div id="pinned" class="pins" role="group" aria-label="Pin" hidden></div>
          <div id="bot-list" class="bot-list"></div>
        </section>
        <div id="bot-activity" class="bot-activity" role="group" aria-labelledby="activity-scope-name" hidden>
        <p class="activity-scope"><span id="activity-scope-avatar" class="avatar"></span><span id="activity-scope-name" class="activity-scope-name"></span></p>
        <section class="nav-section" aria-labelledby="waits-heading">
          <div class="section-heading"><h2 id="waits-heading">Needs you</h2><span id="wait-count" class="count" hidden>0</span></div>
          <div id="wait-list" class="activity-list"></div>
        </section>
        <section class="nav-section" aria-labelledby="sessions-heading">
          <div class="section-heading"><h2 id="sessions-heading">Sessions</h2></div>
          <div id="session-list" class="activity-list"></div>
          <button id="more-sessions" class="text-button load-sessions" type="button" hidden>Show earlier sessions</button>
        </section>
        </div>
      </div>
      <div class="sidebar-foot">
        <div id="connection" class="connection" data-state="loading" role="status"><span class="status-dot" aria-hidden="true"></span><span id="connection-text">Connecting…</span></div>
        <nav class="sidebar-foot-links" aria-label="Flock">
        <a class="sidebar-settings" href="/settings" aria-label="Flock settings" title="Flock settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        </nav>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-mode="system" aria-pressed="true" aria-label="Use system theme" title="Use system theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
          </button>
          <button type="button" data-theme-mode="light" aria-pressed="false" aria-label="Light" title="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/></svg>
          </button>
          <button type="button" data-theme-mode="dark" aria-pressed="false" aria-label="Dark" title="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1Z"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Bot sidebar" tabindex="0"></div>
    <main id="main" class="main">
      <header class="conversation-header">
        <div class="header-inner">
          <button id="open-navigation" class="icon-button narrow-only header-menu" type="button" aria-controls="navigation" aria-expanded="false" aria-label="Open Bot list">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div id="profile-identity" class="profile-identity header-identity" hidden>
            <button id="profile-avatar-button" class="profile-face profile-face-button" type="button" aria-haspopup="dialog" aria-label="Open Bot settings" title="Bot settings">
              <span id="profile-avatar" class="avatar avatar-profile" aria-hidden="true"></span>
              <span class="status-indicator" aria-hidden="true"></span>
            </button>
            <h1 id="profile-heading" class="profile-heading profile-caption" aria-labelledby="profile-name">
              <span id="profile-name" class="profile-name" dir="auto"></span>
              <button id="needs-you" type="button" class="needs-you" aria-labelledby="profile-name needs-you-text" aria-controls="decision-panel" aria-expanded="false" aria-keyshortcuts="Alt+Alt" hidden>
                <span id="needs-you-text">Needs you · <span id="needs-you-count"></span></span>
              </button>
              <span id="profile-status" class="profile-status" hidden></span>
            </h1>
            <span id="needs-you-tooltip" class="needs-you-tooltip" aria-hidden="true"><span>Open</span><kbd>⌥</kbd><kbd>⌥</kbd></span>
          </div>
          <h1 id="profile-placeholder" class="profile-placeholder">Conversation</h1>
          <div id="peer-identity" class="peer-identity header-identity" hidden>
            <span id="peer-faces" class="peer-faces" aria-hidden="true"></span>
            <h1 id="peer-heading" class="peer-title peer-breadcrumb" aria-describedby="peer-description" tabindex="-1">
              <span class="peer-names">
                <button id="peer-parent-link" class="peer-parent-link" type="button"><bdi id="peer-name-first"></bdi></button>
                <span class="peer-sep" aria-hidden="true">›</span>
                <bdi id="peer-name-second" class="peer-thread-label"></bdi>
              </span>
            </h1>
            <span id="peer-description" hidden>Read-only Bot DM</span>
          </div>
          <button id="peer-back" class="icon-button peer-back" type="button" title="Back to conversation (Esc)" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
            <span id="peer-back-label" class="sr-only"></span>
          </button>
          <div id="profile-toolbar" class="profile-toolbar" role="group" aria-label="Conversation controls" hidden>
            <details id="conversation-actions" class="conversation-actions">
              <summary class="icon-button" aria-label="Conversation actions" title="Conversation actions">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
              </summary>
              <div class="conversation-actions-list">
                <button id="find-conversation" class="conversation-action conversation-find-toggle" type="button" aria-keyshortcuts="Control+F Meta+F" aria-controls="conversation-find" aria-expanded="false" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.6"/><path d="m15 15 4 4"/></svg>
                  <span>Find in conversation</span>
                </button>
                <button id="conversation-recent-decisions" class="conversation-action" type="button" aria-controls="decision-panel">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13.5 6.2 6a2 2 0 0 1 1.9-1.5h7.8A2 2 0 0 1 17.8 6l2.2 7.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18v-4.5Zm0 0h4.5l1 2h5l1-2H20"/></svg>
                  <span>History</span>
                </button>
                <button id="peer-picker" class="conversation-action" type="button" aria-haspopup="dialog" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-5 3V6a2 2 0 0 1 1-2Zm14 4a2 2 0 0 1 2 2v10l-5-3h-4"/></svg>
                  <span>Bot DMs</span>
                </button>
              </div>
            </details>
            <button id="toggle-chat-sidebar" class="icon-button toggle-chat-sidebar" type="button" aria-controls="navigation" aria-expanded="true" aria-label="Hide Bot sidebar" title="Hide Bot sidebar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9.5 5v14"/></svg>
            </button>
          </div>
        </div>
      </header>
      <div id="conversation-find" class="conversation-find" role="search" aria-label="Conversation" hidden>
        <div class="find-bar">
          <input type="text" role="searchbox" aria-label="Find in conversation" placeholder="Find in conversation" enterkeyhint="search" maxlength="200" autocomplete="off" spellcheck="false">
          <button type="button" class="icon-button find-previous" aria-label="Previous match" title="Previous match" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
          </button>
          <button type="button" class="icon-button find-next" aria-label="Next match" title="Next match" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button type="button" class="icon-button find-close" aria-label="Close find" title="Close find">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
        </div>
        <p class="find-status" role="status"></p>
        <ul class="find-results" aria-label="Matches" hidden></ul>
        <button type="button" class="text-button find-more" hidden>Search earlier messages</button>
      </div>
      <div class="conversation-frame">
        <section id="conversation" class="conversation" aria-label="Conversation history" tabindex="0">
          <p id="conversation-source-error" class="conversation-source-error" role="alert"></p>
          <div class="conversation-inner">
            <button id="older" type="button" class="text-button older" hidden>Show earlier messages</button>
            <p id="peer-status" class="peer-status" role="status" hidden></p>
            <div id="timeline" class="timeline"></div>
          </div>
        </section>
      </div>
      <div id="decision-layer" class="decision-layer" hidden>
        <div id="decision-shade" class="decision-shade" aria-hidden="true"></div>
        <section id="decision-panel" class="decision-panel" aria-labelledby="decision-heading" tabindex="-1">
          <div class="decision-panel-body">
            <header class="decision-header">
              <h2 id="decision-heading">Needs you</h2>
              <span id="decision-position" class="decision-position" aria-live="polite"></span>
              <div class="decision-controls">
                <button id="decision-previous" class="icon-button" type="button" aria-label="Previous item" title="Previous item" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
                </button>
                <button id="decision-next" class="icon-button" type="button" aria-label="Next item" title="Next item" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                </button>
                <details id="decision-more" class="decision-more">
                  <summary class="icon-button" aria-label="More actions" title="More actions">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
                  </summary>
                  <div id="decision-more-list" class="decision-more-list"></div>
                </details>
                <button id="decision-close" class="icon-button" type="button" aria-label="Close" title="Close (Esc)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
                </button>
              </div>
            </header>
            <p id="decision-message" class="decision-message" role="status"></p>
            <div id="decision-item"></div>
          </div>
        </section>
      </div>
      <button id="jump-to-latest" class="jump-to-latest" type="button" aria-controls="conversation" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5"/></svg>
        Jump to latest
      </button>
      <div class="composer-container" id="composer-container" hidden>
        <p id="view-only-notice" class="view-only-notice" role="status" hidden>View only</p>
        <form id="composer" class="composer">
          <div id="decision-reply-context" class="decision-reply-context" hidden>
            <svg class="decision-reply-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13.5 6.2 6a2 2 0 0 1 1.9-1.5h7.8A2 2 0 0 1 17.8 6l2.2 7.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18v-4.5Z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></svg>
            <p class="reply-target"><span id="decision-reply-label"></span> <span id="decision-reply-target" dir="auto"></span></p>
          </div>
          <div class="composer-box">
            <div id="reply-context" class="reply-context" hidden>
              <svg class="reply-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
              <p class="reply-target"><span id="reply-label" class="sr-only"></span><span id="reply-question"></span></p>
              <button id="cancel-reply" type="button" class="reply-cancel" aria-label="Cancel reply" title="Cancel reply (Esc)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
              </button>
            </div>
            <label class="sr-only" id="compose-label" for="message">Message</label>
            <textarea rows="1" id="message" required enterkeyhint="enter" aria-describedby="notice"></textarea>
            <p id="composer-ghost" class="composer-ghost" aria-hidden="true" hidden><span></span><kbd>↵</kbd></p>
            <ul id="screenshot-previews" class="screenshot-previews" aria-label="Attached screenshots" hidden></ul>
            <div class="composer-toolbar">
              <input id="screenshot-input" type="file" accept="image/png,image/jpeg" multiple hidden>
              <button id="attach-screenshots" class="icon-button attach-screenshots" type="button" aria-label="Attach screenshots" title="Attach screenshots">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <span id="notice" class="notice" role="status"></span>
              <button id="send" class="send" type="submit" aria-label="Send message" aria-keyshortcuts="Enter Control+Enter Meta+Enter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="dialog-head">
      <h2 id="detail-title"></h2>
      <button id="close-detail" type="button" class="icon-button dialog-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div id="detail-nav" class="detail-nav" role="tablist" aria-label="Settings sections" hidden></div>
    <div id="detail-body" class="dialog-body"></div>
  </dialog>
  <dialog id="bot-editor" class="bot-editor-dialog" aria-labelledby="studio-title"></dialog>
</body>
</html>
