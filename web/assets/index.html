<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Flock</title>
  <link rel="icon" type="image/svg+xml" href="/flock.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sidebar.css">
  <link rel="stylesheet" href="/conversation.css">
  <link rel="stylesheet" href="/composer.css">
  <link rel="stylesheet" href="/dialog.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="workspace">
    <aside id="navigation" class="sidebar" aria-label="Bot ナビゲーション">
      <div class="sidebar-head">
        <h2 id="bots-heading" class="sidebar-title">Bots</h2>
        <button id="close-navigation" class="icon-button narrow-only" type="button" aria-label="一覧を閉じる">×</button>
      </div>
      <div class="sidebar-scroll">
        <section class="nav-section bots" aria-labelledby="bots-heading">
          <div id="pinned" class="pins" role="group" aria-label="ピン留め" hidden></div>
          <div id="bot-list" class="bot-list"></div>
        </section>
        <section class="nav-section" aria-labelledby="waits-heading">
          <div class="section-heading"><h2 id="waits-heading">確認待ち</h2><span id="wait-count" class="count" hidden>0</span></div>
          <div id="wait-list" class="activity-list"></div>
        </section>
        <section class="nav-section" aria-labelledby="sessions-heading">
          <div class="section-heading"><h2 id="sessions-heading">セッション</h2></div>
          <div id="session-list" class="activity-list"></div>
          <button id="more-sessions" class="text-button load-sessions" type="button" hidden>以前のセッションを表示</button>
        </section>
      </div>
      <div class="sidebar-foot">
        <div id="connection" class="connection" data-state="loading" role="status"><span class="status-dot" aria-hidden="true"></span><span id="connection-text">接続中…</span></div>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="テーマ">
          <button type="button" data-theme-mode="system" aria-pressed="true" aria-label="システムに合わせる" title="システムに合わせる">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
          </button>
          <button type="button" data-theme-mode="light" aria-pressed="false" aria-label="ライト" title="ライト">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/></svg>
          </button>
          <button type="button" data-theme-mode="dark" aria-pressed="false" aria-label="ダーク" title="ダーク">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1Z"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main id="main" class="main">
      <header class="conversation-header">
        <div class="header-inner">
          <button id="open-navigation" class="icon-button narrow-only" type="button" aria-controls="navigation" aria-expanded="false" aria-label="Bot 一覧を開く">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="profile" class="profile" type="button" aria-haspopup="dialog" aria-label="Bot 設定を開く" hidden>
            <span id="profile-avatar" class="avatar avatar-profile"></span>
            <span class="profile-info"><span id="profile-name" class="profile-name"></span><span id="profile-status" class="profile-status"></span></span>
            <svg viewBox="0 0 24 24" class="profile-arrow" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <h1 id="profile-placeholder" class="profile-name">会話</h1>
          <button id="settings-button" class="icon-button settings-button" type="button" aria-label="Bot 設定を開く" aria-haspopup="dialog" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3m4 0h9M4 12h9m4 0h3M4 17h3m4 0h9"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          </button>
        </div>
      </header>
      <section id="conversation" class="conversation" aria-label="会話履歴" tabindex="0">
        <div class="conversation-inner">
          <button id="older" type="button" class="text-button older" hidden>以前の会話を表示</button>
          <div id="timeline" class="timeline"></div>
        </div>
      </section>
      <div class="composer-container" id="composer-container" hidden>
        <form id="composer" class="composer">
          <div id="reply-context" class="reply-context" hidden>
            <span class="reply-mark" aria-hidden="true">↳</span>
            <div class="reply-target"><strong>質問への返信</strong><span id="reply-question"></span></div>
            <button id="cancel-reply" type="button" class="icon-button" aria-label="返信を取り消す">×</button>
          </div>
          <div class="compose-input">
            <label class="sr-only" id="compose-label" for="message">新しい依頼</label>
            <textarea rows="2" id="message" required></textarea>
            <button id="send" class="send" type="submit" aria-label="新しい依頼を送る">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </div>
        </form>
        <div class="composer-foot"><span id="composer-mode">新しい依頼</span><span id="notice" role="status"></span></div>
      </div>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head">
      <h2 id="detail-title"></h2>
      <button id="close-detail" type="button" class="icon-button" aria-label="閉じる">×</button>
    </div>
    <div id="detail-body" class="dialog-body"></div>
  </dialog>
</body>
</html>
