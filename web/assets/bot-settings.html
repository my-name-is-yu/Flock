<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff">
<title>Sharing and connections</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/settings.css"><script type="module" src="/bot-settings.js"></script></head>
<body><main>
<a id="back" class="settings-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span id="back-label">Back</span></a><h1>Sharing and connections</h1>
<p id="status" role="status"></p>
<section id="local-connections" hidden><h2>Local machine connections</h2><div id="machines"></div></section>
<div id="administration" hidden>
<section id="secrets" hidden><h2>Secrets</h2><div id="inputs"></div></section>
<section id="sharing" hidden><h2>Who can use this Bot</h2><div id="people"></div>
<form id="members"><label>Person ID <input required name="person"></label><button class="button">Add member</button></form></section>
</div>
<section id="channel-senders" aria-labelledby="channel-heading" hidden>
  <h2 id="channel-heading">Channel senders</h2>
  <div class="settings-group">
    <div id="channel-links"></div>
    <form id="channel-sender-form" class="rule-form" hidden>
      <label>Channel <select id="channel-bridge" name="bridge" required></select></label>
      <label>Sender ID <input name="sender" required autocomplete="off" spellcheck="false"></label>
      <label>Flock person ID <input name="person" required autocomplete="off" spellcheck="false"></label>
      <button class="button">Link sender</button>
    </form>
  </div>
</section>
</main></body></html>
