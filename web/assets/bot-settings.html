<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Access · Flock settings</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/settings.css">
  <script type="module" src="/bot-settings.js"></script>
</head>
<body><div class="settings-shell">
  <nav class="settings-nav" aria-label="Settings sections">
    <a id="back" class="settings-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="settings-back-label">Conversations</span></a>
    <a href="/settings#general" data-section="general"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>General</a>
    <a href="/settings#permissions" data-section="permissions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 5 6.5v5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9v-5z"/><path d="m9 12 2 2 4-4"/></svg>Permissions</a>
    <a href="/settings#bots" data-section="bots" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="6" width="15" height="12.5" rx="4"/><path d="M12 6V3.5M9.5 12.2v.6M14.5 12.2v.6"/></svg>Bots</a>
    <a href="/settings#connections" data-section="connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 15 15 9"/><path d="M10.5 6.5 12 5a4.2 4.2 0 0 1 6 6l-1.5 1.5M13.5 17.5 12 19a4.2 4.2 0 0 1-6-6l1.5-1.5"/></svg>Connections</a>
  </nav>
  <main class="settings-page">
    <h1 class="settings-crumb"><a href="/settings#bots">Bots</a><span class="settings-crumb-sep" aria-hidden="true">/</span><span id="crumb-bot"></span><span class="settings-crumb-sep" aria-hidden="true">/</span><span>Access</span></h1>
    <p id="status" role="status"></p>
    <section id="local-connections" aria-labelledby="machines-heading" hidden>
      <h2 id="machines-heading">Connected computers</h2>
      <div id="machines" class="settings-group"></div>
    </section>
    <section id="secrets" aria-labelledby="secrets-heading" hidden>
      <h2 id="secrets-heading">Secrets to provide</h2>
      <div id="inputs" class="settings-group"></div>
    </section>
    <section id="sharing" aria-labelledby="sharing-heading" hidden>
      <h2 id="sharing-heading">Who can use this Bot</h2>
      <div class="settings-group"><div id="people"></div>
        <form id="members" class="settings-row rule-form" hidden>
          <label class="rule-target">Person ID <input required name="person" autocomplete="off" spellcheck="false"></label>
          <button class="button">Add person</button>
        </form>
      </div>
    </section>
  </main>
</div></body>
</html>
