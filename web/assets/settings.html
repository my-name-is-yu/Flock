<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Flock settings</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/settings.css">
  <script type="module" src="/settings.js"></script>
</head>
<body><main>
  <a class="settings-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Conversations</a>
  <h1>Flock settings</h1>
  <p id="status" role="status"></p>
  <div id="policy" hidden>
    <section>
      <h2 id="mode-heading">Permission mode</h2>
      <div id="mode-options" class="mode-options" role="radiogroup" aria-labelledby="mode-heading">
        <label class="mode-option"><input type="radio" name="mode" value="full">
          <span class="mode-option-text"><strong>Full</strong><small>Bots use the access they’re given without asking. Never rules still apply.</small></span></label>
        <label class="mode-option"><input type="radio" name="mode" value="supervised">
          <span class="mode-option-text"><strong>Supervised</strong><small>By default, Bots ask before actions such as opening pull requests, posting to channels, or starting Sessions.</small></span></label>
      </div>
    </section>
    <section><h2>Rules</h2><div id="rules"></div></section>
    <section><h2>T3 connections</h2><div id="connections"></div></section>
  </div>
</main></body>
</html>
